[workspace]
members = [".", "graphite-tui"]

[package]
name = "graphite-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false
repository = "https://github.com/moonbase2090/graphite"

[features]
default = []
# Light-cycle easing and progress helpers (opt-in for pinned consumers).
motion = []
# Categorical chart series colors in `Tokens` (opt-in; adds a public field).
series = []

# Precompute terminal fallback palettes at startup (opt-in).
terminal-palette = []

[[example]]
name = "terminal_palettes"
required-features = ["terminal-palette"]

[dependencies]
unicode-segmentation = "1.13.3"
