[workspace]
members = [".", "graphite-tui"]

[package]
name = "graphite-core"
version = "0.1.5"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false
repository = "https://github.com/moonbase2090/graphite"

[features]
default = []
# Light-cycle easing and progress helpers (opt-in for pinned consumers).
motion = []
# Cell-space spacing, border glyphs and sub-cell glyph order (opt-in).
cell-design = []
# CPU RGBA pixel-buffer primitives (opt-in for pinned consumers).
pixel-buffer = []
# Categorical chart series colors in `Tokens` (opt-in; adds a public field).
series = []
# Interaction state styles (focus, selection, disabled, error) for chrome widgets.
states = []

# Read and write Tokens as TOML theme files (opt-in).
serde = ["dep:toml"]

# Precompute terminal fallback palettes at startup (opt-in).
terminal-palette = []

[[example]]
name = "terminal_palettes"
required-features = ["terminal-palette"]

[[example]]
name = "state_styles"
required-features = ["states"]

[[example]]
name = "theme_toml"
required-features = ["serde"]

[[example]]
name = "theme_crossfade"
required-features = ["motion"]

[[example]]
name = "motion_tokens"
required-features = ["motion"]

[[example]]
name = "pixel_buffer"
required-features = ["pixel-buffer"]

[dependencies]
unicode-segmentation = "1.13.3"
toml = { version = "1", optional = true, default-features = false, features = ["parse", "display", "serde"] }

[dev-dependencies]
proptest = { version = "=1.6.0", default-features = false, features = ["std"] }
