<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Graphite UI gallery</title>
    <script src="theme-bootstrap.js" data-storage-key="graphite.gallery.theme" data-fallback-theme="graphite"></script>
    <link rel="stylesheet" href="../tokens/graphite-tokens.css">
    <link rel="stylesheet" href="components.css">
    <script type="module" src="gallery.js"></script>
  </head>
  <body class="gr-gallery-page">
    <main class="gr-gallery">
      <header class="gr-gallery-header">
        <div><p class="gr-ink-muted">Graphite UI</p><h1>Shared controls</h1></div>
        <div id="theme-menu"></div>
      </header>
      <section class="gr-panel" aria-labelledby="buttons-heading">
        <h2 id="buttons-heading">Buttons and fields</h2>
        <div class="gr-row" id="buttons"></div>
        <div class="gr-gallery-fields" id="fields"></div>
      </section>
      <div class="gr-gallery-columns">
        <section class="gr-panel" aria-labelledby="rail-heading">
          <h2 id="rail-heading">Side rail</h2>
          <div id="rail"></div>
        </section>
        <section class="gr-panel" aria-labelledby="rooms-heading">
          <h2 id="rooms-heading">Rooms</h2>
          <div id="rooms"></div>
        </section>
      </div>
    </main>
  </body>
</html>
