[package]
name = "graphite-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"
publish = false
repository = "https://github.com/moonbase2090/graphite"
description = "Ratatui chrome widgets drawn from Graphite tokens."

[features]
default = []
cell-design = ["graphite-core/cell-design"]

[dependencies]
graphite-core = { path = ".." }
ratatui = { version = "0.29", default-features = false }
unicode-width = "0.2"
