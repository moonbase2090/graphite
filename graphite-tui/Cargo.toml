[package]
name = "graphite-tui"
version = "0.1.4"
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"
publish = false
repository = "https://github.com/moonbase2090/graphite"
description = "Ratatui chrome widgets drawn from Graphite tokens."

[dependencies]
graphite-core = { path = ".." }
ratatui = { version = "0.29", default-features = false }
unicode-width = "0.2"

[dev-dependencies]
graphite-core = { path = "..", features = ["terminal-palette"] }
criterion = { version = "=0.5.1", default-features = false }

[[bench]]
name = "chrome"
harness = false
