name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.features == 'default' && format('Checks ({0})', matrix.os) || format('Checks ({0}, {1})', matrix.os, matrix.features) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        features: [default, motion, pixel-buffer, minimal]
    env:
      FEATURE_ARGS: ${{ matrix.features == 'motion' && '--features motion' || matrix.features == 'pixel-buffer' && '--features pixel-buffer' || matrix.features == 'minimal' && '--no-default-features' || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.85.0
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --locked --all-targets $FEATURE_ARGS -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked $FEATURE_ARGS

      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked $FEATURE_ARGS
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check release text
        run: scripts/check-release-text.sh
        env:
          RELEASE_DENYLIST: ${{ secrets.RELEASE_DENYLIST }}

      - name: Check with Rust 1.85
        run: cargo +1.85.0 check --workspace --all-targets --locked $FEATURE_ARGS

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable

      - name: Install cargo-deny 0.20.2
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check advisories, licenses, bans and sources
        run: cargo deny --log-level warn --manifest-path ./Cargo.toml --config deny.toml --all-features check
